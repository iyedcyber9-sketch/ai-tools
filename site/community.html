<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community - AI Tools</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <img src="assets/icon.svg" alt="AI" width="36" height="36">
        <a href="index.html" class="logo-text">AI Tools</a>
      </div>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_download">Download</a>
        <a href="index.html#features" data-i18n="nav_features">Features</a>
        <a href="community.html" style="color:var(--text)" data-i18n="nav_community">Community</a>
        <div class="toggle-bar">
          <div class="lang-select">
            <button class="lang-btn" onclick="toggleLangMenu()"><span id="lang-label">EN</span></button>
            <div class="lang-menu" id="lang-menu">
              <button data-lang="en" onclick="setLang('en')">English</button>
              <button data-lang="ar" onclick="setLang('ar')">العربية</button>
              <button data-lang="es" onclick="setLang('es')">Español</button>
              <button data-lang="fr" onclick="setLang('fr')">Français</button>
            </div>
          </div>
          <button class="theme-btn" onclick="toggleTheme()"><span id="theme-icon">🌙</span></button>
        </div>
      </nav>
    </div>
  </header>

  <div class="comm-hero">
    <div class="container">
      <a href="index.html" class="back-link" data-i18n="comm_back">← Back to Download</a>
      <h1 data-i18n="comm_hero_title">Community</h1>
      <p data-i18n="comm_hero_desc">Reviews, feedback, and bug reports from AI Tools users.</p>
    </div>
  </div>

  <div class="container" style="padding-top:40px">
    <div class="section-nav">
      <button class="active" onclick="showSection('reviews',this)" data-i18n="comm_tab_reviews">Reviews</button>
      <button onclick="showSection('bugs',this)" data-i18n="comm_tab_bugs">Bug Reports</button>
      <button onclick="showSection('write',this)" data-i18n="comm_tab_write">Write a Review</button>
    </div>

    <!-- REVIEWS -->
    <div class="comm-section active" id="sec-reviews">
      <div class="comm-header">
        <h2 data-i18n="comm_reviews_title">User Reviews</h2>
        <div class="comm-stats">
          <span id="review-count">0 <span data-i18n="comm_reviews_count">reviews</span></span>
          <span data-i18n="comm_avg">Avg:</span> <strong id="review-avg">-</strong>
        </div>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterReviews('all',this)" data-i18n="comm_filter_all">All</button>
        <button class="filter-btn" onclick="filterReviews('5',this)" data-i18n="comm_filter_5">5 Stars</button>
        <button class="filter-btn" onclick="filterReviews('4',this)" data-i18n="comm_filter_4">4 Stars</button>
        <button class="filter-btn" onclick="filterReviews('3',this)" data-i18n="comm_filter_3">3 Stars</button>
        <button class="filter-btn" onclick="filterReviews('low',this)" data-i18n="comm_filter_low">1-2 Stars</button>
      </div>
      <div id="reviews-list" class="review-grid"></div>
    </div>

    <!-- BUGS -->
    <div class="comm-section" id="sec-bugs">
      <div class="comm-header">
        <h2 data-i18n="comm_bugs_title">Bug Reports</h2>
        <div class="comm-stats">
          <span id="bug-count">0 <span data-i18n="comm_bugs_count">reports</span></span>
          <span id="bug-open-count">0 <span data-i18n="comm_bugs_open">open</span></span>
        </div>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterBugs('all',this)" data-i18n="comm_filter_all">All</button>
        <button class="filter-btn" onclick="filterBugs('critical',this)" data-i18n="comm_filter_critical">Critical</button>
        <button class="filter-btn" onclick="filterBugs('high',this)" data-i18n="comm_filter_high">High</button>
        <button class="filter-btn" onclick="filterBugs('medium',this)" data-i18n="comm_filter_medium">Medium</button>
        <button class="filter-btn" onclick="filterBugs('low',this)" data-i18n="comm_filter_low_sev">Low</button>
      </div>
      <div id="bugs-list" class="bug-list"></div>
    </div>

    <!-- WRITE -->
    <div class="comm-section" id="sec-write">
      <div class="write-panel">
        <h3 data-i18n="comm_write_review">Share Your Experience</h3>
        <form id="review-form">
          <div class="form-grid">
            <div class="fg"><label data-i18n="comm_name">Name</label><input type="text" id="r-name" data-i18n-ph="comm_name_ph" placeholder="Your name" required></div>
            <div class="fg"><label data-i18n="comm_platform">Platform</label><select id="r-platform"><option>Windows</option><option>Linux</option><option>Android</option></select></div>
            <div class="fg form-full"><label data-i18n="comm_rating">Rating</label><div class="stars-input" id="stars-in"><span class="s" data-v="1">&#9733;</span><span class="s" data-v="2">&#9733;</span><span class="s" data-v="3">&#9733;</span><span class="s" data-v="4">&#9733;</span><span class="s" data-v="5">&#9733;</span></div></div>
            <div class="fg form-full"><label data-i18n="comm_review_label">Your Review</label><textarea id="r-msg" rows="4" data-i18n-ph="comm_review_ph" placeholder="What do you think about AI Tools?" required></textarea></div>
            <div class="fg form-full"><button type="submit" class="btn-submit" id="r-btn" data-i18n="comm_submit_review">Submit Review</button><div id="r-msg-box" class="form-msg"></div></div>
          </div>
        </form>
      </div>
      <div class="write-panel" style="margin-top:24px">
        <h3 data-i18n="comm_report_bug">Report a Bug</h3>
        <form id="bug-form">
          <div class="form-grid">
            <div class="fg"><label data-i18n="comm_name">Name</label><input type="text" id="b-name" data-i18n-ph="comm_name_ph" placeholder="Your name" required></div>
            <div class="fg"><label data-i18n="comm_platform">Platform</label><select id="b-platform"><option>Windows</option><option>Linux</option><option>Android</option></select></div>
            <div class="fg"><label data-i18n="comm_version">App Version</label><input type="text" id="b-version" data-i18n-ph="comm_version_ph" placeholder="v1.0.1"></div>
            <div class="fg"><label data-i18n="comm_severity">Severity</label><select id="b-severity"><option value="low" data-i18n="comm_sev_low">Low</option><option value="medium" data-i18n="comm_sev_medium" selected>Medium</option><option value="high" data-i18n="comm_sev_high">High</option><option value="critical" data-i18n="comm_sev_critical">Critical</option></select></div>
            <div class="fg form-full"><label data-i18n="comm_bug_title">Bug Title</label><input type="text" id="b-title" data-i18n-ph="comm_bug_title_ph" placeholder="Brief summary" required></div>
            <div class="fg form-full"><label data-i18n="comm_bug_happened">What happened?</label><textarea id="b-msg" rows="3" data-i18n-ph="comm_bug_happened_ph" placeholder="Describe the bug..." required></textarea></div>
            <div class="fg form-full"><label data-i18n="comm_bug_steps">Steps to Reproduce (optional)</label><textarea id="b-steps" rows="3" data-i18n-ph="comm_bug_steps_ph" placeholder="1. Open app&#10;2. Go to...&#10;3. Click..."></textarea></div>
            <div class="fg form-full"><button type="submit" class="btn-submit" id="b-btn" data-i18n="comm_submit_bug">Submit Bug Report</button><div id="b-msg-box" class="form-msg"></div></div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <p data-i18n="footer_copy">© 2026 AI Tools. MIT License.</p>
      <div class="footer-links">
        <a href="https://github.com/iyedcyber9-sketch/ai-tools" target="_blank" data-i18n="footer_github">GitHub</a>
        <a href="index.html" data-i18n="footer_download">Download</a>
        <a href="community.html" data-i18n="footer_community">Community</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
