name: ai_tools
description: "AI Tools - Free Offline AI for Everyone. Local CPU/GPU inference with DeepSeek & Qwen models."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & Utils
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.0
  device_info_plus: ^11.5.0
  system_info2: ^4.0.0
  dio: ^5.7.0
  crypto: ^3.0.5

  # Local Storage (hive_ce is maintained fork of hive)
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0

  # UI
  flutter_markdown: ^0.7.6+1
  markdown: ^7.2.2
  animated_text_kit: ^4.2.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  file_picker: ^10.1.2
  syncfusion_flutter_pdf: ^28.2.7
  syncfusion_flutter_pdfviewer: ^28.2.7
  url_launcher: ^6.2.5
  window_manager: ^0.4.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10

  # LLM Inference - CPU + GPU (Vulkan/CUDA/OpenCL)
  # llama_cpp_dart works on Win/Linux/Android via FFI; fallback to Ollama on desktop
  llama_cpp_dart: ^0.2.2
  http: ^1.2.1
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_ce_generator: ^1.9.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/models.json
    - assets/logos/
